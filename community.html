<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script>
      (function () {
        if (location.protocol === "file:") return;
        var path = location.pathname;
        if (/\/community\/?$/.test(path)) {
          document.write(
            '<base href="' + path.replace(/community\/?$/, "") + '">'
          );
        }
      })();
    </script>
    <title>Community Block</title>
    <link
      rel="preload"
      href="assets/fonts/FF_Sans-Regular_web.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <section
      class="community"
      data-view="grid"
      aria-labelledby="community-title"
    >
      <header class="community-header">
        <div class="community-header__inner">
          <h1 class="community-title" id="community-title">The Community</h1>
          <p class="community-lede">
            Everything we learned about you and your skin, became the
            ingredients which shaped us.
          </p>
        </div>
      </header>

      <div class="community-stage">
        <div class="community-grid">
        <article
          class="community-card"
          data-index="0"
          data-details="Ann, Model"
          data-figbar="WeHo, Los Angeles"
          data-hero="assets/community/hero-ann.jpg"
        >
          <img
            src="assets/community/portrait-1.jpg"
            alt="Portrait of a woman with long dark wavy hair looking downward"
            width="1600"
            height="2000"
          />
          <button
            class="media-control"
            type="button"
            aria-label="View details for Ann, Model"
          >
            <span class="media-control__icon" aria-hidden="true">
              <img
                src="assets/community/icon-plus.svg"
                alt=""
                width="20"
                height="20"
              />
            </span>
          </button>
        </article>

        <article
          class="community-card"
          data-index="1"
          data-details="Addison, Creative"
          data-figbar="Culver City, Los Angeles"
          data-hero="assets/community/hero-addison.jpg"
        >
          <img
            src="assets/community/portrait-2.jpg"
            alt="Portrait of a man with bleached blonde hair and a neck tattoo"
            width="2000"
            height="1600"
          />
          <button
            class="media-control"
            type="button"
            aria-label="View details for Addison, Creative"
          >
            <span class="media-control__icon" aria-hidden="true">
              <img
                src="assets/community/icon-plus.svg"
                alt=""
                width="20"
                height="20"
              />
            </span>
          </button>
        </article>

        <article
          class="community-card"
          data-index="2"
          data-details="Mina, Model"
          data-figbar="Silver Lake, Los Angeles"
        >
          <img
            src="assets/community/portrait-3.jpg"
            alt="Portrait of a woman with gold hoop earrings and hair pulled back"
            width="1600"
            height="2000"
          />
          <button
            class="media-control"
            type="button"
            aria-label="View details for Mina, Model"
          >
            <span class="media-control__icon" aria-hidden="true">
              <img
                src="assets/community/icon-plus.svg"
                alt=""
                width="20"
                height="20"
              />
            </span>
          </button>
        </article>

        <article
          class="community-card"
          data-index="3"
          data-details="Noor, Artist"
          data-figbar="Echo Park, Los Angeles"
        >
          <img
            src="assets/community/portrait-4.jpg"
            alt="Profile portrait of a woman with long straight dark hair"
            width="1600"
            height="2000"
          />
          <button
            class="media-control"
            type="button"
            aria-label="View details for Noor, Artist"
          >
            <span class="media-control__icon" aria-hidden="true">
              <img
                src="assets/community/icon-plus.svg"
                alt=""
                width="20"
                height="20"
              />
            </span>
          </button>
        </article>

        <article
          class="community-card"
          data-index="4"
          data-details="Willa, Writer"
          data-figbar="Venice, Los Angeles"
        >
          <img
            src="assets/community/portrait-5.jpg"
            alt="Portrait of a smiling woman with strawberry-blonde wavy hair"
            width="1600"
            height="2000"
          />
          <button
            class="media-control"
            type="button"
            aria-label="View details for Willa, Writer"
          >
            <span class="media-control__icon" aria-hidden="true">
              <img
                src="assets/community/icon-plus.svg"
                alt=""
                width="20"
                height="20"
              />
            </span>
          </button>
        </article>

        <article
          class="community-card"
          data-index="5"
          data-details="Sloane, Designer"
          data-figbar="Santa Monica, Los Angeles"
        >
          <img
            src="assets/community/portrait-6.jpg"
            alt="Portrait of a laughing woman with blonde hair and glasses"
            width="1500"
            height="2000"
          />
          <button
            class="media-control"
            type="button"
            aria-label="View details for Sloane, Designer"
          >
            <span class="media-control__icon" aria-hidden="true">
              <img
                src="assets/community/icon-plus.svg"
                alt=""
                width="20"
                height="20"
              />
            </span>
          </button>
        </article>

        <article
          class="community-card"
          data-index="6"
          data-details="Omar, Photographer"
          data-figbar="Downtown, Los Angeles"
        >
          <img
            src="assets/community/portrait-7.jpg"
            alt="Portrait of a man with a mustache looking downward"
            width="2000"
            height="1600"
          />
          <button
            class="media-control"
            type="button"
            aria-label="View details for Omar, Photographer"
          >
            <span class="media-control__icon" aria-hidden="true">
              <img
                src="assets/community/icon-plus.svg"
                alt=""
                width="20"
                height="20"
              />
            </span>
          </button>
        </article>

        <article
          class="community-card"
          data-index="7"
          data-details="Zora, Musician"
          data-figbar="Highland Park, Los Angeles"
        >
          <img
            src="assets/community/portrait-8.jpg"
            alt="Profile portrait of a woman with braids and eyes closed"
            width="1600"
            height="2000"
          />
          <button
            class="media-control"
            type="button"
            aria-label="View details for Zora, Musician"
          >
            <span class="media-control__icon" aria-hidden="true">
              <img
                src="assets/community/icon-plus.svg"
                alt=""
                width="20"
                height="20"
              />
            </span>
          </button>
        </article>
        </div>

        <div class="community-detail" aria-hidden="true" inert>
        <aside class="detail-info">
          <div class="detail-portrait">
            <img
              data-detail="portrait"
              src="assets/community/portrait-1.jpg"
              alt=""
              width="1600"
              height="2000"
            />
          </div>
          <div class="detail-meta">
            <p class="detail-meta__label">Details</p>
            <p class="detail-meta__value" data-detail="details">Ann, Model</p>
          </div>
          <div class="detail-meta">
            <p class="detail-meta__label">Fig bar</p>
            <p class="detail-meta__value" data-detail="figbar">
              WeHo, Los Angeles
            </p>
          </div>
        </aside>

        <div class="detail-media">
          <img
            data-detail="hero"
            src="assets/community/hero-ann.jpg"
            alt=""
            width="1600"
            height="2000"
          />
          <button
            class="media-control media-control--pause"
            type="button"
            data-pause
            aria-pressed="true"
            aria-label="Pause community ticker"
          >
            <span class="media-control__icon" aria-hidden="true">
              <img
                class="icon-pause"
                src="assets/community/icon-pause.svg"
                alt=""
                width="4.15"
                height="9"
              />
            </span>
          </button>
        </div>

        <div class="detail-ticker" aria-hidden="true">
          <div class="detail-ticker__viewport">
            <div class="detail-ticker__track">
              <div class="detail-ticker__row">
                <span>Details</span>
                <span data-ticker="details">Ann, Model</span>
              </div>
              <div class="detail-ticker__row">
                <span>Fig bar</span>
                <span data-ticker="figbar">WeHo, Los Angeles</span>
              </div>
              <div class="detail-ticker__row">
                <span>Details</span>
                <span data-ticker="details-dup">Ann, Model</span>
              </div>
              <div class="detail-ticker__row">
                <span>Fig bar</span>
                <span data-ticker="figbar-dup">WeHo, Los Angeles</span>
              </div>
            </div>
          </div>
        </div>

        <div class="detail-rail">
          <div class="detail-thumbs" data-thumbs></div>
          <button class="text-link view-all" type="button" data-view-all>
            <span class="icon-box icon-box--arrow" aria-hidden="true">
              <img
                class="icon-arrow"
                src="assets/icon-arrow.svg"
                alt=""
                width="12.226"
                height="9"
              />
            </span>
            View all
          </button>
        </div>
        </div>
      </div>
    </section>

    <script src="community.js"></script>
  </body>
</html>
