<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BTS — FFFormulations</title>
    <link
      rel="preload"
      href="../assets/fonts/FF_Sans-Regular_web.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="stylesheet" href="../styles.css" />
    <link rel="stylesheet" href="../bts.css?v=6" />
  </head>
  <body>
    <section class="bts" aria-label="BTS">
      <div class="bts-frame">
        <div class="bts-world" data-world>
        <div class="bts-tile" data-tile>
          <figure class="bts-card" data-layer="bottles">
            <img
              src="../assets/bts/tray.jpg"
              alt=""
              width="1800"
              height="1200"
            />
          </figure>
          <figure class="bts-card" data-layer="bowl">
            <img
              src="../assets/bts/bowl.jpg"
              alt=""
              width="1200"
              height="1800"
            />
          </figure>
          <figure class="bts-card" data-layer="tubes">
            <img
              src="../assets/bts/tubes.jpg"
              alt=""
              width="1200"
              height="1800"
            />
          </figure>
          <figure class="bts-card" data-layer="tray">
            <img
              src="../assets/bts/tray.jpg"
              alt=""
              width="1800"
              height="1200"
            />
          </figure>
          <figure class="bts-card" data-layer="portrait">
            <img
              src="../assets/bts/portrait.jpg"
              alt=""
              width="1200"
              height="1800"
            />
          </figure>
          <figure class="bts-card" data-layer="formulations">
            <img
              src="../assets/bts/formulations.jpg"
              alt=""
              width="1200"
              height="1800"
            />
          </figure>
          <figure class="bts-card" data-layer="silhouette">
            <img
              src="../assets/bts/silhouette.jpg"
              alt=""
              width="1200"
              height="1800"
            />
          </figure>
          <figure class="bts-card" data-layer="moodboard">
            <img
              src="../assets/bts/moodboard.jpg"
              alt=""
              width="1200"
              height="1800"
            />
          </figure>
          <figure class="bts-card" data-layer="caps">
            <img
              src="../assets/bts/caps.jpg"
              alt=""
              width="1200"
              height="1800"
            />
          </figure>
        </div>
        </div>
      </div>
    </section>
    <script src="../bts.js?v=9"></script>
  </body>
</html>
